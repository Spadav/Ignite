    binary: build-ignite/bin/llama-server
    buildDir: build-ignite
    cudaCompiler: ""
    cudaToolkitRoot: ""
    cudaArchitectures: []
    repo: https://github.com/ggml-org/llama.cpp
    buildCmd: ""

