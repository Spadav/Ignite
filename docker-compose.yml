services:
  ignite:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ignite
    restart: "${IGNITE_RESTART_POLICY:-no}"
    ports:
      - "${IGNITE_PORT:-3000}:3000"
    environment:
      IGNITE_DOCKER: "1"
      LLAMA_SWAP_URL: "http://llama-runtime:8090"
      LLMFIT_URL: "http://llmfit:8787"
      SPEACHES_URL: "http://speaches:8000"
      IGNITE_MODELS_DIR: "${IGNITE_MODELS_DIR:-${SWAPDECK_MODELS_DIR:-./models}}"
      IGNITE_CONFIG_DIR: "${IGNITE_CONFIG_DIR:-${SWAPDECK_CONFIG_DIR:-./config}}"
      IGNITE_PORT: "${IGNITE_PORT:-3000}"
      LLAMA_SWAP_PORT: "${LLAMA_SWAP_PORT:-8090}"
      SPEACHES_PORT: "${SPEACHES_PORT:-8000}"
      IGNITE_APP_VERSION: "1.0.0"
      LLAMA_CPP_IMAGE_REF: "${LLAMA_CPP_IMAGE:-spadav/llama-cpp-server:latest}"
      LLAMA_SWAP_VERSION_REF: "${LLAMA_SWAP_VERSION:-211}"
      LLMFIT_IMAGE_REF: "ghcr.io/alexsjones/llmfit:latest"
      SPEACHES_IMAGE_REF: "ghcr.io/speaches-ai/speaches:latest-cpu"
    volumes:
      - ${IGNITE_MODELS_DIR:-${SWAPDECK_MODELS_DIR:-./models}}:/models
      - ${IGNITE_CONFIG_DIR:-${SWAPDECK_CONFIG_DIR:-./config}}:/config
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - llama-runtime
      - llmfit
      - speaches
  llama-runtime:
    build:
      context: .
      dockerfile: docker/llama-runtime/Dockerfile
      args:
        LLAMA_CPP_IMAGE: "${LLAMA_CPP_IMAGE:-spadav/llama-cpp-server:latest}"
        LLAMA_SWAP_VERSION: "${LLAMA_SWAP_VERSION:-211}"
    container_name: llama-runtime
    restart: "${IGNITE_RESTART_POLICY:-no}"
    ports:
      - "${LLAMA_SWAP_PORT:-8090}:8090"
    volumes:
      - ${IGNITE_MODELS_DIR:-${SWAPDECK_MODELS_DIR:-./models}}:/models
      - ${IGNITE_CONFIG_DIR:-${SWAPDECK_CONFIG_DIR:-./config}}:/config
  llmfit:
    image: ghcr.io/alexsjones/llmfit:latest
    container_name: llmfit
    restart: "${IGNITE_RESTART_POLICY:-no}"
    command: ["serve", "--host", "0.0.0.0", "--port", "8787"]

  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    container_name: speaches
    restart: "${IGNITE_RESTART_POLICY:-no}"
    ports:
      - "${SPEACHES_PORT:-8000}:8000"
    volumes:
      - ${IGNITE_MODELS_DIR:-${SWAPDECK_MODELS_DIR:-./models}}/audio/huggingface:/home/ubuntu/.cache/huggingface/hub
      - ${IGNITE_MODELS_DIR:-${SWAPDECK_MODELS_DIR:-./models}}/audio/model_aliases.json:/home/ubuntu/speaches/model_aliases.json
