services:
  ignite:
    environment:
      SPEACHES_IMAGE_REF: "ghcr.io/speaches-ai/speaches:latest-cuda"

  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cuda
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
